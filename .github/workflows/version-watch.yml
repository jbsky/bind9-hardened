# =====================================================================
#  Version Watch — ISC BIND 9.20.x upstream release detection
#
#  Quotidien 06h00 UTC :
#    1. Check ISC downloads for new 9.20.x stable version
#    2. Compare with versions.json
#    3. If update available: bump versions.json (seule source ; le Dockerfile n'a plus de valeur par defaut) → commit → push
#    4. Idem pour OpenSSL 3.5.x (compile depuis les sources, 2026-10-03)
# =====================================================================
name: version-watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check & bump BIND version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream version
        id: check
        run: |
          set -euo pipefail

          CURRENT=$(jq -r '.bind' versions.json)
          echo "current=${CURRENT}"

          # Fetch ISC downloads page and find latest 9.20.x
          LATEST=$(curl -fsSL https://downloads.isc.org/isc/bind9/ \
            | grep -oP '9\.20\.\d+' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest BIND 9.20 version"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=${LATEST}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already up to date (${CURRENT})"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: ${CURRENT} → ${LATEST}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
            echo "previous=${CURRENT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions
        if: steps.check.outputs.updated == 'true'
        env:
          NEW_VER: ${{ steps.check.outputs.version }}
          PREV_VER: ${{ steps.check.outputs.previous }}
        run: |
          set -euo pipefail

          jq --arg v "$NEW_VER" '.bind = $v' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

          # BIND installe ses bibliotheques sous le nom de la release
          # (libdns-9.20.27.so), sans lien soname : le manifeste les nomme donc
          # en toutes lettres. Sans cette ligne, chaque bump publie un commit
          # que la porte « Image manifest » refuse -- 9.20.29 est reste trois
          # semaines non publie ainsi (2026-09).
          PREV_RE=$(printf '%s' "$PREV_VER" | sed 's/\./\\./g')
          sed -i "s/-${PREV_RE}\.so\$/-${NEW_VER}.so/" image.manifest
          grep -q -- "-${NEW_VER}\.so\$" image.manifest || {
            echo "::error::image.manifest ne nomme aucune bibliotheque ${NEW_VER}"; exit 1; }

          echo "Updated to BIND ${NEW_VER}"
          cat versions.json

      # OpenSSL est compile depuis les sources (signature verifiee contre
      # l'empreinte OPENSSL_FPR) : rien ne le suivait, et 9.20.29.1 est sorti
      # en 3.5.8 alors que 3.5.9 etait publie (2026-10-03). On reste sur la
      # branche LTS 3.5 ; un changement de branche se fait a la main.
      - name: Check & bump OpenSSL 3.5.x
        id: openssl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r '.openssl' versions.json)
          LATEST=$(gh api repos/openssl/openssl/tags --paginate --jq '.[].name' \
            | grep -E '^openssl-3\.5\.[0-9]+$' | sed 's/^openssl-//' | sort -V | tail -1)
          [[ "$LATEST" =~ ^3\.5\.[0-9]+$ ]] || { echo "::error::OpenSSL 3.5 illisible : '${LATEST}'"; exit 1; }
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "OpenSSL a jour (${CURRENT})"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq --arg v "$LATEST" '.openssl = $v' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "msg=openssl ${CURRENT} → ${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.check.outputs.updated == 'true' || steps.openssl.outputs.updated == 'true'
        env:
          BIND_MSG: ${{ steps.check.outputs.updated == 'true' && format('bind {0} → {1}', steps.check.outputs.previous, steps.check.outputs.version) || '' }}
          OPENSSL_MSG: ${{ steps.openssl.outputs.msg }}
        run: |
          set -euo pipefail
          MSG=$(printf '%s\n' "$BIND_MSG" "$OPENSSL_MSG" | sed '/^$/d' | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json image.manifest
          git commit -m "chore(deps): bump ${MSG}"
          git push

      - name: Trigger build-push
        if: steps.check.outputs.updated == 'true' || steps.openssl.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger `on: push` workflows
          # (anti-recursion protection). Explicitly dispatch build-push instead.
          gh workflow run build-push.yml --ref main
