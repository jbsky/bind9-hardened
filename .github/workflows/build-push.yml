# =====================================================================
#  build-push -- bind9-hardened
#  Tout le pipeline vient du gabarit de jbsky/hardened-ci (lint, build,
#  tests sur le digest exact, arm64 natif, garde de revision, promotion
#  signee, SBOM attestee, README, purge, release, issue si echec).
#  Ce depot ne decrit que ce qui le distingue : .github/hardened-ci.json.
#  Le filtre paths: doit couvrir les entrees du compteur de revision : le
#  gabarit le verifie (hci-config.py --check).
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - 'init.go'
      - 'init_test.go'
      - 'go.mod'
      # cles GPG, patch et script copies dans l'image : entrees du build
      # (et du compteur de revision, memes chemins)
      - 'keys/**'
      - 'patches/**'
      - 'strip-inplace.sh'
      - 'versions.json'
      - 'scripts/**'
      - 'image.manifest'
      - '.github/hardened-ci.json'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: jbsky/hardened-ci/.github/workflows/build-push.yml@67a9607975fe93f321af197bbe2fae827bb44a9c # v1.0.2
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
